<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c7a065">
<title>RIZZITGO · Reps Agent Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --kraft:#c7a065; --paper:#f7f1e3; --paper-d:#e9dfc8;
  --ink:#1c1610; --ink-soft:#4a4236;
  --stamp:#c0391b; --tape:#28477e; --tape-d:#1b3260;
  --ok:#2f7d4f; --warn:#a8700a; --bad:#b3261e;
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{
  font-family:'Archivo',sans-serif;color:var(--ink);min-height:100vh;
  background:
    radial-gradient(1200px 500px at 50% -10%, rgba(255,255,255,.22), transparent 60%),
    repeating-linear-gradient(93deg, rgba(0,0,0,.045) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(3deg, rgba(255,255,255,.05) 0 3px, transparent 3px 9px),
    var(--kraft);
  background-attachment:fixed;
  padding-bottom:calc(48px + env(safe-area-inset-bottom));
}
body.shake{animation:shk .3s}
@keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}}
.mono{font-family:'Space Mono',monospace}
button{font-family:inherit;cursor:pointer;padding:0}
img{max-width:100%}
/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:2px solid var(--ink);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#hud .wordmark{font-weight:900;font-size:19px;letter-spacing:-.5px;line-height:1}
#hud .wordmark small{display:block;font-family:'Space Mono';font-weight:400;font-size:8px;letter-spacing:2px;color:var(--stamp)}
.hstat{display:flex;align-items:center;gap:6px;font-family:'Space Mono';font-size:12px;font-weight:700;
  background:var(--paper-d);border:1.5px solid var(--ink);padding:4px 9px;border-radius:4px;white-space:nowrap}
.hstat svg{width:14px;height:14px;flex:0 0 auto}
.hstat.neg{color:var(--bad)}
.hbtn{margin-left:auto;display:flex;gap:8px}
.ibtn{width:38px;height:38px;border:2px solid var(--ink);background:var(--paper);border-radius:6px;display:flex;align-items:center;justify-content:center}
.ibtn svg{width:18px;height:18px}
.ibtn:active{transform:translateY(2px)}
@media(max-width:620px){
  #hud{gap:6px;padding:6px 8px}
  #hud .wordmark{font-size:15px}
  .hstat{font-size:10px;padding:3px 6px}
  .hstat .lbl{display:none}
  .ibtn{width:34px;height:34px}
}
/* ---------- LAYOUT ---------- */
#wrap{max-width:1060px;margin:0 auto;padding:14px 12px 26px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}
#wrap>main,#wrap>aside{min-width:0}
@media(max-width:920px){#wrap{grid-template-columns:minmax(0,1fr)}}
/* ---------- STEPPER ---------- */
#stepper{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;min-width:0}
#stepper::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-family:'Space Mono';font-size:10px;font-weight:700;
  padding:5px 9px;border:1.5px solid var(--ink);background:var(--paper-d);color:var(--ink-soft);border-radius:4px;letter-spacing:.5px}
.step svg{width:12px;height:12px}
.step.done{background:var(--paper);color:var(--ok)}
.step.done svg{color:var(--ok)}
.step.cur{background:var(--tape);color:#fff;border-color:var(--tape-d);box-shadow:2px 2px 0 rgba(0,0,0,.25)}
/* ---------- PANELS ---------- */
.panel{background:var(--paper);border:2px solid var(--ink);border-radius:8px;position:relative;
  box-shadow:5px 5px 0 rgba(0,0,0,.22);overflow:hidden;margin-bottom:14px;min-width:0}
.panel .tapebar{background:var(--tape);color:#fff;font-family:'Space Mono';font-size:10px;font-weight:700;letter-spacing:2px;
  padding:5px 0;overflow:hidden;white-space:nowrap;border-bottom:2px solid var(--tape-d)}
.panel .tapebar span{display:inline-block;animation:mq 14s linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.pbody{padding:14px;min-width:0}
@media(max-width:560px){.pbody{padding:10px}}
.corner{position:absolute;width:44px;height:16px;background:rgba(40,71,126,.28);border:1px solid rgba(27,50,96,.4);z-index:1}
.corner.tl{top:-6px;left:-14px;transform:rotate(-38deg)}
.corner.br{bottom:-6px;right:-14px;transform:rotate(-38deg)}
/* ---------- BUTTONS / CHIPS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;
  font-size:14px;padding:11px 18px;background:var(--ink);color:var(--paper);border:2px solid var(--ink);border-radius:6px;
  box-shadow:3px 3px 0 rgba(0,0,0,.3);transition:transform .08s;min-height:44px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.3)}
.btn.red{background:var(--stamp);border-color:#7e2410;color:#fff}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.sm{font-size:11px;padding:7px 11px;min-height:36px;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:'Space Mono';font-size:10px;font-weight:700;
  border:1.5px solid var(--ink);border-radius:4px;padding:3px 7px;background:var(--paper-d);letter-spacing:.5px;
  max-width:100%;min-width:0;overflow-wrap:anywhere}
.chip.req{background:#f6e3b4;border-color:var(--warn);color:#7a5205}
.chip.ok{background:#d9ecd9;border-color:var(--ok);color:var(--ok)}
.chip.bad{background:#f4d7d3;border-color:var(--bad);color:var(--bad)}
.chip svg{width:11px;height:11px;flex:0 0 auto}
.tag{font-family:'Space Mono';font-size:9px;font-weight:700;letter-spacing:1px;padding:2px 6px;border-radius:3px;color:#fff;flex:0 0 auto}
.tag.low{background:#8a6a3d}.tag.mid{background:var(--tape)}.tag.top{background:var(--stamp)}
/* ---------- STAMPS ---------- */
.stampbox{display:inline-block;border:3px solid var(--stamp);color:var(--stamp);font-weight:900;text-transform:uppercase;
  letter-spacing:1px;padding:6px 12px;border-radius:5px;transform:rotate(-7deg);font-size:15px;
  -webkit-mask-image:radial-gradient(circle at 25% 25%, #000 97%, transparent 100%);
  mask-image:radial-gradient(circle at 25% 25%, #000 97%, transparent 100%)}
.stampbox.in{animation:stampIn .45s cubic-bezier(.2,2.2,.4,1) both}
@keyframes stampIn{from{transform:rotate(-16deg) scale(2.6);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}
/* ---------- ITEMS ---------- */
.itemrow{display:flex;gap:12px;align-items:center;border:1.5px solid var(--ink);border-radius:8px;background:#fff9ec;padding:10px;margin-bottom:10px}
.itemrow .art{flex:0 0 96px;background:var(--paper-d);border:1.5px solid var(--ink);border-radius:6px;padding:4px}
.itemrow .art svg{display:block;width:100%;height:auto}
.itemrow>div:last-child{min-width:0;flex:1}
.itemrow .nm{font-weight:900;font-size:14px;line-height:1.15;overflow-wrap:anywhere}
.itemrow .bd{font-family:'Space Mono';font-size:10px;color:var(--ink-soft);margin-top:2px;overflow-wrap:anywhere}
@media(max-width:560px){.itemrow .art{flex:0 0 72px}}
.budgetbar{height:22px;border:2px solid var(--ink);border-radius:5px;background:var(--paper-d);overflow:hidden;position:relative;margin:6px 0 2px}
.budgetbar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--tape) 0 8px,var(--tape-d) 8px 16px);transition:width .4s}
.budgetbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Space Mono';font-size:10px;font-weight:700}
/* ---------- CLIENTE ---------- */
.cli{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.avat{width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:18px;color:#fff;box-shadow:2px 2px 0 rgba(0,0,0,.25);flex:0 0 auto}
.cli>div{min-width:0}
.cli .un{font-weight:900;font-size:17px}
.cli .geo{font-family:'Space Mono';font-size:10px;color:var(--ink-soft)}
/* ---------- SELLER / LINEE ---------- */
.seller{border:2px solid var(--ink);border-radius:8px;padding:10px;margin-bottom:8px;background:#fff9ec;display:flex;gap:10px;align-items:center;cursor:pointer}
.seller.sel{background:#dfe8f4;box-shadow:3px 3px 0 var(--tape)}
.seller>svg{width:18px;height:18px;flex:0 0 auto}
.seller>div{min-width:0;flex:1}
.seller .pr{font-family:'Space Mono';font-weight:700;font-size:16px;margin-left:auto;text-align:right;flex:0 0 auto}
.seller .pr small{display:block;font-size:9px;font-weight:400;color:var(--ink-soft)}
.seller .snm{font-weight:900;font-size:13px}
.seller .sbl{font-size:11px;color:var(--ink-soft);line-height:1.25;margin-top:2px;overflow-wrap:anywhere}
/* ---------- QC ---------- */
.qcwrap{position:relative;border:2px solid var(--ink);border-radius:8px;background:
  linear-gradient(var(--paper-d) 1px,transparent 1px),linear-gradient(90deg,var(--paper-d) 1px,transparent 1px);
  background-size:22px 22px;background-color:#fbf6ea;padding:8px;min-height:190px;display:flex;align-items:center;justify-content:center}
.qcwrap .art{width:min(300px,80%);max-width:100%}
.qcwrap .art svg{display:block;width:100%;height:auto}
.hotspot{position:absolute;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--stamp);background:rgba(247,241,227,.92);
  font-family:'Space Mono';font-weight:700;font-size:12px;color:var(--stamp);display:flex;align-items:center;justify-content:center;
  transform:translate(-50%,-50%);animation:pls 1.6s infinite;z-index:3}
@media(pointer:coarse){.hotspot{width:44px;height:44px;font-size:14px}}
@keyframes pls{0%,100%{box-shadow:0 0 0 2px rgba(192,57,27,.25)}50%{box-shadow:0 0 0 8px rgba(192,57,27,.08)}}
.hotspot.done{border-color:var(--ok);color:var(--ok);animation:none;background:#e2f0e2}
.hotspot.bad{border-color:var(--bad);background:#f7ddd7;color:var(--bad);animation:none}
.hotspot:disabled{cursor:default}
.qcres{font-family:'Space Mono';font-size:11px;margin-top:8px;border-left:3px solid var(--bad);padding:5px 8px;background:#f7ddd7;border-radius:3px;overflow-wrap:anywhere}
/* ---------- SERVIZI ---------- */
.svc{display:flex;align-items:center;gap:10px;border:1.5px solid var(--ink);border-radius:8px;padding:9px 11px;margin-bottom:8px;background:#fff9ec;cursor:pointer}
.svc>svg{width:18px;height:18px;flex:0 0 auto}
.svc>div{min-width:0;flex:1}
.svc .sw{margin-left:auto;width:52px;height:28px;border:2px solid var(--ink);border-radius:16px;background:var(--paper-d);position:relative;flex:0 0 auto}
.svc .sw i{position:absolute;top:2px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink);transition:left .15s}
.svc.on .sw{background:var(--ok)}
.svc.on .sw i{left:25px;background:#fff}
.svc .tk{font-weight:900;font-size:13px}
.svc .ds{font-size:11px;color:var(--ink-soft);overflow-wrap:anywhere}
/* ---------- PACK ---------- */
.boxopt{border:2px solid var(--ink);border-radius:8px;padding:9px;text-align:center;cursor:pointer;background:#fff9ec;min-width:0}
.boxopt.sel{background:#dfe8f4;box-shadow:3px 3px 0 var(--tape)}
.boxopt .bs{font-weight:900;font-size:18px}
.boxopt .bv{font-family:'Space Mono';font-size:10px;color:var(--ink-soft)}
.packviz{border:2.5px dashed var(--ink);border-radius:8px;min-height:120px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;background:#fbf6ea}
.packviz .mini{width:52px;border:1.5px solid var(--ink);border-radius:5px;background:var(--paper-d);padding:3px}
.packviz .mini svg{display:block;width:100%;height:auto}
.packviz.over{border-color:var(--bad);animation:shk .3s}
.fillbar{height:14px;border:2px solid var(--ink);border-radius:4px;background:var(--paper-d);overflow:hidden}
.fillbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
/* ---------- LINEE ---------- */
.line{border:2px solid var(--ink);border-radius:8px;padding:9px 11px;margin-bottom:8px;background:#fff9ec;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.line.sel{background:#dfe8f4;box-shadow:3px 3px 0 var(--tape)}
.line.dis{opacity:.45;cursor:not-allowed}
.line .lnm{font-weight:900;font-size:14px;min-width:0;overflow-wrap:anywhere}
.line .lnm .mono{font-size:10px;color:var(--ink-soft)}
.line .ldt{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap;font-family:'Space Mono';font-size:10px;align-items:center;min-width:0}
.risk{display:inline-flex;gap:2px;align-items:center}
.risk b{width:7px;height:11px;background:var(--paper-d);border:1px solid var(--ink);display:inline-block;border-radius:1px}
.risk b.on{background:var(--stamp)}
/* ---------- CHAT ---------- */
#chatcol{display:flex;flex-direction:column;gap:10px;min-width:0}
#chatbox{background:var(--paper);border:2px solid var(--ink);border-radius:8px;box-shadow:5px 5px 0 rgba(0,0,0,.22);
  display:flex;flex-direction:column;overflow:hidden;position:sticky;top:64px;min-width:0}
#chathead{background:var(--tape);color:#fff;padding:8px 12px;font-weight:900;font-size:13px;display:flex;gap:8px;align-items:center;border-bottom:2px solid var(--tape-d)}
#chathead svg{width:15px;height:15px;flex:0 0 auto}
#chatlog{height:min(52vh,480px);overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;background:
  repeating-linear-gradient(0deg, rgba(0,0,0,.025) 0 2px, transparent 2px 26px),var(--paper-d)}
.msg{max-width:86%;padding:7px 10px;border-radius:9px;font-size:12.5px;line-height:1.35;border:1.5px solid var(--ink);animation:fu .25s both;overflow-wrap:anywhere}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .who{display:block;font-family:'Space Mono';font-size:8.5px;font-weight:700;letter-spacing:1px;color:var(--ink-soft);margin-bottom:2px}
.msg.cl{align-self:flex-start;background:#fffdf4;border-bottom-left-radius:2px}
.msg.ag{align-self:flex-end;background:#d9ecd9;border-bottom-right-radius:2px}
.msg.sys{align-self:center;background:var(--paper);font-family:'Space Mono';font-size:10px;color:var(--ink-soft);border-style:dashed;max-width:96%}
.typing{align-self:flex-start;display:flex;gap:4px;padding:9px 11px;background:#fffdf4;border:1.5px solid var(--ink);border-radius:9px;border-bottom-left-radius:2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-soft);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,100%{opacity:.25;transform:none}50%{opacity:1;transform:translateY(-3px)}}
#chatFab{display:none;position:fixed;right:14px;bottom:calc(60px + env(safe-area-inset-bottom));z-index:61;width:52px;height:52px;border-radius:50%;
  background:var(--stamp);color:#fff;border:2.5px solid var(--ink);align-items:center;justify-content:center;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
#chatFab svg{width:23px;height:23px}
#chatFab .bdg{position:absolute;top:-6px;right:-6px;background:var(--ink);color:#fff;font-family:'Space Mono';font-size:10px;font-weight:700;
  min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;border:1.5px solid var(--paper)}
@media(max-width:920px){
 #chatcol{position:fixed;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom));z-index:60;transform:translateY(115%);
   transition:transform .28s;padding:0 10px 10px;pointer-events:none}
 #chatcol.open{transform:none;pointer-events:auto}
 #chatbox{box-shadow:0 -6px 24px rgba(0,0,0,.3)}
 #chatlog{height:54vh}
 #chatFab{display:flex}
}
/* ---------- FOOTER SPONSOR ---------- */
#sponsor{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);color:var(--paper);
  display:flex;align-items:center;gap:10px;padding:6px 12px;padding-bottom:calc(6px + env(safe-area-inset-bottom));
  font-family:'Space Mono';font-size:10px;letter-spacing:1px}
#sponsor .sTxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sponsor b{color:#f0b34d}
#sponsor .fLink{margin-left:auto;color:#f0b34d;text-decoration:underline;font-weight:700;white-space:nowrap}
/* ---------- PROMO (link al sito personale) ---------- */
.promo{display:flex;flex-direction:column;gap:8px;border:2.5px dashed var(--ink);border-radius:8px;background:#fffdf4;padding:14px;text-decoration:none;color:var(--ink)}
.promo .pTag{font-family:'Space Mono';font-size:9px;letter-spacing:2px;color:var(--stamp);font-weight:700}
.promo .pt{font-weight:900;font-size:16px;line-height:1.1}
.promo .ps{font-family:'Space Mono';font-size:10px;color:var(--ink-soft);line-height:1.55;overflow-wrap:anywhere}
.promo .pbtn{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--stamp);color:#fff;border:2px solid #7e2410;border-radius:6px;
  padding:9px 14px;font-weight:900;font-size:12px;letter-spacing:.5px;box-shadow:3px 3px 0 rgba(0,0,0,.3)}
.promo .pbtn svg{width:14px;height:14px}
.promo .pu{font-family:'Space Mono';font-size:9px;color:var(--ink-soft);overflow-wrap:anywhere}
/* ---------- OVERLAY ---------- */
.ovl{position:fixed;inset:0;z-index:80;background:rgba(28,22,16,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.ovl .card{background:var(--paper);border:2.5px solid var(--ink);border-radius:10px;box-shadow:8px 8px 0 rgba(0,0,0,.35);
  max-width:640px;width:100%;max-height:92vh;overflow-y:auto;position:relative}
.ovl .card .pbody{padding:20px}
#ovl2 .ovl{z-index:95}
.revrow{border:1.5px solid var(--ink);border-radius:8px;padding:10px;margin-bottom:9px;background:#fff9ec;animation:fu .4s both}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars svg{width:15px;height:15px}
.stars .f{fill:#e8a020;color:#e8a020}
.stars .e{color:#b9ad95}
.bigtitle{font-weight:900;font-size:clamp(26px,7vw,44px);line-height:.95;text-transform:uppercase;letter-spacing:-1px;overflow-wrap:anywhere}
.kv{display:flex;justify-content:space-between;gap:10px;font-family:'Space Mono';font-size:12px;padding:5px 0;border-bottom:1px dashed rgba(0,0,0,.2);align-items:center;flex-wrap:wrap}
.kv span,.kv b{min-width:0;overflow-wrap:anywhere}
.kv b{font-weight:700;text-align:right}
/* ---------- FX ---------- */
#fx{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(28,22,16,.78);overflow:hidden}
#fx.on{display:flex}
#fx .stage{position:relative;width:min(480px,88vw);aspect-ratio:1.15;display:flex;align-items:center;justify-content:center}
#fx .fxbox{width:72%;filter:drop-shadow(6px 8px 0 rgba(0,0,0,.35))}
#fx .tapeline{position:absolute;left:-15%;right:-15%;top:46%;height:58px;background:var(--tape);border-top:3px solid var(--tape-d);border-bottom:3px solid var(--tape-d);
  display:flex;align-items:center;overflow:hidden;transform:translateX(-130%) rotate(-3deg)}
#fx .tapeline.go{transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform:translateX(0) rotate(-3deg)}
#fx .tapeline b{font-family:'Space Mono';color:#fff;font-size:15px;letter-spacing:3px;white-space:nowrap;animation:mq 9s linear infinite}
#fx .bigstamp{position:absolute;top:14%;left:50%;transform:translateX(-50%) rotate(-10deg);font-size:30px}
#fx .bigstamp.in{animation:stampIn2 .4s cubic-bezier(.2,2.4,.4,1) both}
@keyframes stampIn2{from{transform:translateX(-50%) rotate(-22deg) scale(2.6);opacity:0}to{transform:translateX(-50%) rotate(-10deg) scale(1);opacity:1}}
#fx .lab{background:var(--paper);border:2px solid var(--ink);padding:14px 16px;width:min(340px,84vw);border-radius:4px;
  transform:translateY(-120%);transition:transform .45s cubic-bezier(.2,1.3,.4,1);box-shadow:5px 6px 0 rgba(0,0,0,.4)}
#fx .lab.go{transform:none}
/* ---------- TRANSITO ---------- */
.road{position:relative;border-top:3px dashed var(--ink);margin-top:6px;height:96px;overflow:hidden}
.truck{position:absolute;bottom:6px;left:-140px;width:120px;transition:left 2.6s linear}
.truck.go{left:calc(100% - 124px)}
.truck svg{display:block;width:100%}
.wheel{animation:spin 1s linear infinite;transform-box:fill-box;transform-origin:center}

/* ---------- TOAST ---------- */
#toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(94vw,420px)}
.toast{background:var(--ink);color:var(--paper);font-family:'Space Mono';font-size:11.5px;padding:9px 14px;border-radius:6px;

.toast.bad{background:var(--stamp);color:#fff;border-color:#7e2410}
.toast.ok{background:var(--ok);color:#fff;border-color:#1d5636}
ul.rules{list-style:none;font-size:12.5px;line-height:1.55}
ul.rules li{display:flex;gap:9px;margin-bottom:9px;align-items:flex-start}
ul.rules svg{width:16px;height:16px;flex:0 0 auto;margin-top:2px;color:var(--stamp)}
.hr{border:none;border-top:2px dashed var(--ink);opacity:.35;margin:12px 0}
.note{font-family:'Space Mono';font-size:10px;color:var(--ink-soft);line-height:1.5;overflow-wrap:anywhere}
.flashtag{background:var(--stamp);color:#fff;font-weight:900;padding:3px 10px;border-radius:4px;font-size:11px;letter-spacing:1px;display:inline-flex;align-items:center;gap:6px}

 d.className='msg '+(from==='ag'?'ag':from==='sys'?'sys':'cl');

 if(from!=='ag'&&from!=='sys'){S.unread++;updFab()}}

  FRANCIA:['@N Rue Oberkampf, 75011 Paris, FR']};
 const g=(geo||'').split(' ')[0];
 const arr=P[g]||P.ITALIA;
 let a=arr[i%arr.length].replace(/@N/g,String(ri(1,99)));
 if(i>0)a+=' — STUDIO';

function mkItems(ids){return ids.map(id=>{const it=CATALOG.find(x=>x.id===id);
 return {ref:it,sellers:TIERS.map(t=>({tier:t.k,price:Math.round(it.price[t.k]*(0.92+RNG()*0.2)/5)*5,transit:2+Math.floor(RNG()*3),name:pick(SELLERS)})),
  chosen:-1,defects:[],defText:{},wrong:false,wrongShown:false,checked:{},accepted:{},swapped:{},flagged:{},ignoredFlag:{},flaggedOrder:false}})}
function mkOrder(sc,day,isFlash){
 const c=CLIENTS[sc.cli];const items=mkItems(sc.items);
 let est=0,vol=0,wt=0;
 items.forEach(o=>{est+=o.ref.price[sc.expect];
  const db=sc.serv.includes('debox')&&o.ref.deboxable,vac=sc.serv.includes('vacuum')&&o.ref.soft;
  vol+=o.ref.vol*(db?.45:1)*(vac?.5:1); wt+=o.ref.wt*(db?.78:1)});
 const line=LINES.find(l=>l.id===sc.pref)||LINES[0];
 const bx=BOXES.find(b=>b.vol>=vol*1.3)||BOXES[3];
 const bill=Math.max(wt+bx.wt,bx.vol*.25);
 const shipEst=Math.round(line.base+line.rate*Math.max(bill,line.min||0));
 const servTar=sc.serv.reduce((a,k)=>a+SERVICES[k].fee,0);
 const budget=Math.round((est+servTar+shipEst)*(sc.expect==='top'?1.18:1.22)/10)*10;
 const addrs=[];for(let k=0;k<sc.addr;k++)addrs.push({lab:k===0?'CASA':'STUDIO · '+(sc.anote||''),txt:addrFor(c.geo,k)});
 return {day,cli:sc.cli,sc,items,budget,shipCover:shipEst,addrs,reqIdx:sc.addr===2?(sc.req||1):0,
  services:{},photos:false,box:null,addrIdx:-1,lineId:null,sealed:false,shipped:false,cancelled:false,
  spent:0,rev:0,isFlash:!!isFlash,arrDay:0,arrived:false,truckStarted:false}}
function genWeek(){
 const ckeys=shuffle(Object.keys(CLIENTS).slice());
 const pool=shuffle(CATALOG.slice());
 const flashDays=[];while(flashDays.length<2){const d=ri(2,6);if(!flashDays.includes(d))flashDays.push(d)}
 S.orders=[];
 for(let d=1;d<=7;d++){
  const ck=ckeys[(d-1)%ckeys.length];
  const c=CLIENTS[ck];
  let n=(d===7)?ri(3,4):ri(1,3);
  if(c.pers==='broke'||c.pers==='chill')n=Math.min(n,2);
  const ids=pool.splice(0,n).map(x=>x.id);
  const refs=ids.map(id=>CATALOG.find(x=>x.id===id));
  let expect;
  if(c.pers==='qcnerd'||c.pers==='flexer')expect='top';
  else if(c.pers==='broke')expect='low';
  else if(c.pers==='reseller')expect='mid';
  else expect=pick(['low','mid','mid','mid','top']);
  const serv=[];
  serv.push(expect==='top'?'photoHD':(RNG()<.3?'photoStd':'photoHD'));
  if(refs.some(r=>r.deboxable)&&RNG()<.75)serv.push('debox');
  if(refs.some(r=>r.soft)&&RNG()<.65)serv.push('vacuum');
  if(refs.some(r=>r.fragile)&&RNG()<.8)serv.push('protect');
  if(RNG()<.35)serv.push('detag');
  const liq=refs.some(r=>r.liquid),batt=refs.some(r=>r.battery);
  const cands=LINES.filter(l=>(!liq||l.liq)&&(!batt||l.batt));
  let pref;
  if(c.pers==='broke')pref='gd';
  else if(c.pers==='reseller'||c.pers==='flexer')pref=pick(['dle','yan','yan']);
  else pref=pick(cands).id;
  if(!cands.some(l=>l.id===pref))pref=pick(cands).id;
  const two=(c.pers==='reseller')||RNG()<.2;
  S.orders.push(mkOrder({cli:ck,items:ids,expect,serv,pref,addr:two?2:1,req:1,
   anote:pick(['ship to STUDIO','STUDIO, non casa','secondo indirizzo, non casa']),
   flash:flashDays.includes(d)},d,false));
 }
}

function tierScore(o){let pts=0;const rank={low:0,mid:1,top:2};
 o.items.forEach(it=>{const t=it.sellers[it.chosen].tier;const e=o.sc.expect;
  const d=rank[t]-rank[e];
  if(d===0)pts+=.6;else if(d>0)pts+=.8;else pts+=(e==='top'&&t==='low')?-2:-1.2});
 return pts}
function finishWeek(){closeOvl();closeOvl2();S.finished=true;
 const all=S.orders.concat(S.flashOrders);
 all.forEach(o=>{if(!o.shipped&&!o.cancelled)o.cancelled=true;
  o.wrongAny=o.items.some(it=>it.wrong);o.rev=o.rev||0;o.spent=o.spent||0});
 const reviews=[];
 all.forEach(o=>{
  const c=CLIENTS[o.cli];
  let stars,fac='',p,customs='ok',damaged=false,wrongAddr=false;
  if(o.cancelled){
   p=o.rev-o.spent-(o.rev>0?o.budget:0);stars=1;fac='ordine annullato';
  }else{
   const l=LINES.find(x=>x.id===o.lineId)||LINES[0];
   let kept=0;o.items.forEach(it=>{if(it.ref.deboxable&&!o.services.debox)kept++});
   const risk=Math.min(.85,l.risk+kept*.09+((o.items.some(x=>x.ref.highValue)&&l.risk>.2)?.1:0)+(o.services.detag?-.03:0));
   const roll=RNG();if(roll<risk)customs='seized';else if(roll<risk+.1)customs='duty';
   wrongAddr=o.addrIdx!==o.reqIdx;
   const fragile=o.items.some(x=>x.ref.fragile)&&!o.services.protect;
   damaged=fragile&&RNG()<.3;
   let pts=tierScore(o);let noticed=0,shippedDef=0;
   o.items.forEach(it=>{it.defects.forEach(k=>{
     if(it.swapped[k])return;
     shippedDef++;
     const pN=c.notice*(it.flagged[k]?1.15:(it.checked[k]?1:.9));
     if(it.flagged[k]&&it.ignoredFlag&&it.ignoredFlag[k]){noticed++;pts-=1.6}
     else if(RNG()<pN){noticed++;pts-=1.2}
   })});
   S.stats.defShip+=shippedDef;S.stats.defNoticed+=noticed;
   if(o.wrongAny){pts-=2.5;fac='item sbagliato'}
   o.sc.serv.forEach(k=>{if(!o.services[k]){pts-=.8;fac=fac||'servizio mancante'}});
   const extras=Object.keys(o.services).filter(k=>!o.sc.serv.includes(k)).length;
   pts+=Math.min(.4,extras*.2);
   pts+=(o.lineId===o.sc.pref)?.4:-.4;
   if(customs==='duty')pts-=.6;
   if(damaged)pts-=1.2;
   if(wrongAddr)pts-=2;
   stars=Math.max(1,Math.min(5,Math.round((3+pts)*2)/2));
   p=o.rev-o.spent;
   if(customs==='seized'){p-=o.rev;S.money-=o.rev;S.stats.seized++;stars=1;fac='sequestro doganale'}
   if(customs==='duty')S.stats.duty++;
   if(damaged){const dm=Math.round(o.budget*.4);p-=dm;S.money-=dm;S.stats.dmg++;fac=fac||'pacco danneggiato'}
   if(wrongAddr){const rp=Math.round(o.shipCover);p-=rp;S.money-=rp;S.stats.ret++;fac=fac||'indirizzo sbagliato'}
   if(o.items.every(it=>it.sellers[it.chosen].tier==='low')&&o.sc.expect!=='low'){const dp=Math.round(o.budget*.15);p-=dp;S.money-=dp;fac=fac||'disputa qualità'}
   if(o.arrDay>7)S.stats.late++;
  }
  o.profit=Math.round(p);
  fac=fac||(stars>=4.5?'consegna perfetta':stars>=3.5?'buon lavoro':'qualcosa è scivolato');
  reviews.push({o,stars,fac,p,customs,damaged,wrongAddr});
 });
 renderHUD();
 const total=Math.round(S.money);
 S.lastFinal={reviews,profit:total};
 finalOverlay(reviews,total)}

     '<span class="mono" style="font-size:11px;font-weight:700">'+esc(CLIENTS[r.o.cli].u)+'</span>'+
     '<span class="stars">'+[1,2,3,4,5].map(n=>'<i data-lucide="star" class="'+(n<=r.stars?'f':'e')+'"></i>').join('')+'</span>'+
     '<span class="chip '+(r.stars>=4?'ok':r.stars>=3?'':'bad')+'">'+esc(r.fac)+'</span>'+
     '<b class="mono" style="margin-left:auto;font-size:11px;color:'+(r.p>=0?'var(--ok)':'var(--bad)')+'">'+fmt(r.p)+'</b>'+
    '</div>'+
    '<p style="font-size:12px;margin-top:5px;line-height:1.4">'+esc(reviewText(r))+'</p>'+
   '</div>').join('')+
  (badges.length?'<h3 style="font-weight:900;margin:12px 0 8px">Timbri conquistati</h3>'+
   '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px">'+badges.map(b=>'<span class="stampbox" style="font-size:11px">'+b+'</span>').join('')+'</div>':'')+
  '<hr class="hr">'+
  promoCard()+
  '<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">'+
   '<button class="btn red" onclick="replay()"><i data-lucide="rotate-ccw"></i>Altra settimana</button>'+
   '<button class="btn ghost" onclick="closeOvl()"><i data-lucide="package"></i>Rivedi il magazzino</button></div>'+
 '</div></div></div>';
 icons();AU.chime()}
function reviewText(r){const o=r.o;
 if(o.cancelled)return pick(['Ordine annullato e budget restituito, ma il mio fit-check è morto. Mai più.','Niente pacco, niente scuse vere. 1 stella dovere.']);
 if(r.customs==='seized')return pick(['Package SEIZED alla dogana. Budget cremato. 1 stella e un pensiero.','La linea che "dichiara tutto" ha dichiarato tutto. RIP. Mai più.']);
 if(r.wrongAddr)return pick(["Il pacco è finito all'indirizzo SBAGLIATO. Come si fa??",'Spedito dove non dovevi. Ora mia moglie sa tutto. Grazie eh.']);
 if(o.wrongAny)return pick(['Mi è arrivato l\'ITEM SBAGLIATO. Come si fa a confondere due prodotti??']);
 if(r.damaged)return pick(['Arrivato danneggiato: senza bolla, il vetro era "un\'ipotesi". Deluso.','Pacco ammaccato come le mie aspettative. Protezione: parola che dovresti cercare.']);
 if(r.stars>=4.5)return pick(['W agent. Foto QC ottime, nastro ovunque, arrivo in tempi. 5/5 senza pensieri.','Unboxing da video. Tutto intatto, tutto pulito. Sei il mio agente fisso adesso.','Imballo da banca, timing da treno svizzero. Confirmed.']);
 if(r.stars>=3.5)return pick(['Solido. Piccole cose, ma lo rifarei. 4 stelle.','Buon lavoro, shipping un filo lento ma item puliti. Si riparte presto.']);
 if(r.stars>=2.5)return pick(['Mid experience. Niente di rotto, niente di memorabile. 3 stelle di garanzia.']);
 if(r.stars>=1.5)return pick(['Il QC doveva essere fatto, non "pensato". Non felice.',"Sotto le aspettative che PAGAVO per avere. La prossima volta leggo le recensioni meglio."]);
 return pick(['Mai più. Ti metto nella blacklist del server. 1 stella.','Esperienza da dimenticare, purtroppo ho le foto come promemoria.'])}

/* ---------- FX ---------- */
function fxSeal(cb){const fx=document.getElementById('fx');if(!S.cur){cb();return}
 fx.innerHTML='<div class="stage">'+
   '<div class="fxbox">'+boxSVG(S.cur.box,S.cur.items.length/4)+'</div>'+
   '<div class="tapeline" id="tl"><b>'+'RIZZITGO QUALITY TAPE ★ '.repeat(12)+'</b></div>'+
   '<div class="bigstamp" id="bs" style="display:none">QC PASSATO</div>'+
  '</div>';
 fx.classList.add('on');AU.tape();
 setTimeout(()=>{const t=document.getElementById('tl');if(t)t.classList.add('go')},60);
 setTimeout(()=>{AU.stamp();const bs=document.getElementById('bs');
   if(bs){bs.style.display='block';bs.classList.add('in')}
   document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),350)},650);
 setTimeout(()=>{fx.classList.remove('on');fx.innerHTML='';cb()},1700)}

   '<div style="margin-top:8px">'+barcode(trk)+'</div>'+
   '<div class="mono" style="font-size:9px;display:flex;justify-content:space-between;margin-top:4px;flex-wrap:wrap;gap:4px"><span>'+esc(l.n.toUpperCase())+'</span><span>'+billable().toFixed(1)+'KG</span><span>BOX '+esc(o.box)+'</span></div>'+
  '</div></div>';
 fx.classList.add('on');AU.tape();
 setTimeout(()=>{const lb=document.getElementById('lab');if(lb)lb.classList.add('go')},80);
 setTimeout(()=>{AU.stamp()},500);
 setTimeout(()=>{fx.classList.remove('on');fx.innerHTML='';cb()},1400)}
